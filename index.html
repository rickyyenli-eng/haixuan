<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>海選 — 你不是在評審，你是在被評審</title>
<style>
:root{
  --ink:#14111c; --ink2:#1d1826; --line:#372f45;
  --amber:#e8a33d; --amber-dim:#8a6425;
  --cyan:#5fd4c4; --paper:#efe9dd; --dim:#9a90a8; --red:#c0453a;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"PingFang TC","Noto Sans TC","Hiragino Sans",system-ui,sans-serif;
  --serif:"Songti TC","Noto Serif TC",Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;line-height:1.65}
.wrap{max-width:720px;margin:0 auto;padding:24px 20px 80px}
h1{font-family:var(--serif);font-size:clamp(34px,9vw,58px);line-height:1.06;margin:0 0 14px;
  letter-spacing:.02em;font-weight:700}
h2{font-family:var(--serif);font-size:24px;margin:0 0 6px;font-weight:700}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--amber);
  text-transform:uppercase;margin:0 0 14px}
p{margin:0 0 14px}
.muted{color:var(--dim)}
.small{font-size:13px}
button{font:inherit;cursor:pointer;border-radius:2px;transition:.15s}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn{background:transparent;border:1px solid var(--line);color:var(--paper);
  padding:13px 18px;width:100%;text-align:left;margin-bottom:9px;display:block}
.btn:hover{border-color:var(--amber);background:#1b1626}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1206;font-weight:700;
  text-align:center}
.btn.primary:hover{background:#f2b95c}
.btn.danger{border-color:var(--red);color:#e8917f}
.btn:disabled{opacity:.32;cursor:default}
.card{border:1px solid var(--line);background:var(--ink2);padding:18px;margin-bottom:16px}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px solid #272033;font-size:14px}
.rowline:last-child{border-bottom:0}
.mono{font-family:var(--mono)}
.dl{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  border:1px solid var(--line);color:var(--dim);padding:5px 11px;text-decoration:none;
  margin-left:8px;vertical-align:middle;white-space:nowrap}
.dl:hover{border-color:var(--amber);color:var(--amber)}
.dlrow{margin:10px 0 4px}
.dlrow .dl{margin-left:0;margin-right:8px}

/* 招牌：轉椅 */
.stage{position:relative;height:190px;display:grid;place-items:center;margin:8px 0 20px}
.chair{width:150px;height:150px;border-radius:50% 50% 8px 8px;border:2px solid var(--line);
  background:radial-gradient(circle at 50% 35%,#241d31,#161122);
  display:grid;place-items:center;transition:transform 1s cubic-bezier(.2,.8,.2,1);
  transform:rotateY(0deg);transform-style:preserve-3d}
.chair.turned{transform:rotateY(180deg);border-color:var(--amber);
  box-shadow:0 0 0 1px var(--amber-dim),0 12px 60px -18px var(--amber)}
.chair span{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--dim)}
.chair.turned span{transform:rotateY(180deg);color:var(--amber)}
.timer{position:absolute;top:0;right:0;font-family:var(--mono);font-size:34px;color:var(--amber)}
.timer small{display:block;font-size:10px;letter-spacing:.2em;color:var(--dim);text-align:right}
.bar{height:2px;background:#241e30;margin:14px 0 4px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--amber);width:0}

.coach{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:5px 9px;
  color:var(--dim)}
.chip.on{border-color:var(--amber);color:var(--amber)}
.chip.me{border-color:var(--cyan);color:var(--cyan)}
.result{font-family:var(--mono);font-size:12px;letter-spacing:.1em;margin-top:10px}
.ok{color:var(--cyan)} .bad{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:7px 4px;border-bottom:1px solid #272033}
th{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:400}
.num{font-family:var(--mono);text-align:right}
.slider{width:100%;accent-color:var(--amber);margin:6px 0}
audio{width:100%;margin:10px 0}
.hide{display:none}
.report-num{font-family:var(--mono);font-size:15px}
.pos{color:var(--cyan)} .neg{color:var(--red)}
@media (prefers-reduced-motion:reduce){.chair{transition:none}}

/* 同步歌詞 */
.lyric{min-height:56px;text-align:center;margin:12px 0 4px;font-family:var(--serif)}
.lyric .now{font-size:19px;line-height:1.5;color:var(--paper);transition:opacity .25s}
.lyric .next{font-size:13px;color:var(--dim);margin-top:5px;opacity:.75}
.lyrall{max-height:240px;overflow-y:auto;border:1px solid var(--line);background:#12101a;padding:8px 10px;margin:10px 0}
.lyrall p{margin:0;padding:5px 8px;font-family:var(--serif);font-size:15px;line-height:1.5;color:var(--dim);cursor:pointer}
.lyrall p:hover{color:var(--paper);background:#1b1626}
.lyrall p.on{color:var(--amber);background:#1b1626}
.seekbar{cursor:pointer;padding:6px 0}
</style>
</head>

const lyricBox=()=>`<div class="lyric"><div class="now" style="opacity:.35">♪</div><div class="next"></div></div>`;
function attachLyrics(au,song,box){
  const L=(typeof LYRICS!=="undefined")&&LYRICS[song];
  if(!L||!box){if(box)box.style.display="none";return}
  const now=box.querySelector(".now"),nx=box.querySelector(".next");
  au.addEventListener("timeupdate",()=>{
    const t=au.currentTime;let cur=null,next=null;
    for(const ln of L){
      if(t>=ln[0]-0.15&&t<=ln[1]+0.35){cur=ln}
      else if(ln[0]>t){next=ln;break}
    }
    now.textContent=cur?cur[2]:"♪";
    now.style.opacity=cur?1:0.35;
    nx.textContent=next?next[2]:"";
  });
}
const S={i:0,order:[],teams:{},turns:[],persuade:[],scores:[],events:[],
  pkN:0,pkPicks:[],saves:{},gone:[],night:null,noCut:[],keeper:[],declined:[],cuts:[]};
const shuffled=n=>{const a=[...Array(n).keys()];
  for(let k=a.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a};
const teamOf=id=>Object.keys(S.teams).find(t=>S.teams[t].includes(id));
const alive=()=>Object.values(S.teams).flat();

function visitorId(){let v=null;try{v=sessionStorage.getItem("hx_v")}catch(e){}

async function cloud(action,payload){
  if(!ONLINE) return null;
  try{const r=await fetch(CLOUD_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(Object.assign({action,key:CLOUD_WRITE_KEY,visitor:visitorId(),coaches:NPCLIST()},payload))});
    const jj=await r.json(); return jj&&jj.ok?jj:null;}catch(e){return null}
}
/* ---------- 進度暫存 ---------- */
const SAVEKEY="hx_save3";
let fi=0;
function resetState(){
  PUB0.forEach((p,k)=>PUB[k]=p); pmReset(); COACHES=["你","老派技術控","情緒派","市場派"];
  S.i=0;S.order=shuffled(PUB.length);
  S.teams={};COACHES.forEach(x=>{S.teams[x]=[]});
  S.turns=[];S.persuade=[];S.scores=[];S.events=[];S.pkN=0;S.pkPicks=[];
  S.saves={};COACHES.forEach(x=>S.saves[x]=1);S.gone=[];S.night=null;fi=0;
  S.noCut=[];S.keeper=[];S.declined=[];S.cuts=[];
}
function saveGame(phase){try{localStorage.setItem(SAVEKEY,JSON.stringify(
  {v:4,ts:Date.now(),phase,fi,S,coaches:COACHES,pm:pmSave(),pub:PUB[PM.on?PUB.findIndex(p=>p.id===PM.me):0]}))}catch(e){}}
function loadGame(){try{const j=JSON.parse(localStorage.getItem(SAVEKEY));
  return j&&j.v===4&&j.S&&j.S.teams?j:null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVEKEY)}catch(e){}}
function applySave(j){
  Object.assign(S,j.S); fi=j.fi||0;
  if(j.coaches) COACHES=j.coaches;
  pmLoad(j.pm);
  if(PM.on&&j.pub){const k=PUB.findIndex(p=>p.id===PM.me); if(k>=0) PUB[k]=j.pub;}
  if(!S.order||S.order.length!==PUB.length) S.order=shuffled(PUB.length);
  if(j.phase==="finals") return finals();
  if(j.phase==="night") return nightIntro();
  if(j.phase==="pk") return pk();
  return blind();
}
function saveLabel(j){
  if(j.phase==="pk") return "PK 第一夜";
  if(j.phase==="night") return "決選之夜";
  if(j.phase==="finals") return "決賽 第 "+((j.fi||0)+1)+" 位";
  return "盲選 "+Math.min(j.S.i+1,PUB.length)+" / "+PUB.length;
}
function exportSave(){const j=loadGame();if(!j)return;
  const b=new Blob([JSON.stringify(j)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="海選進度.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function importSave(file){const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result);
    if(!j||j.v!==4||!j.S||!j.S.teams)throw 0;
    try{localStorage.setItem(SAVEKEY,JSON.stringify(j))}catch(e){}
    applySave(j);}catch(e){alert("這個檔案不是海選的進度檔（或是舊版）");}};
  rd.readAsText(file)}

const forcedNow=()=>S.i<PUB.length && !isMe(PUB[S.order[S.i]].id)
  && zeroTeams().length>0 && (PUB.length-S.i)<=Math.max(2,zeroTeams().length);
function blind(){
  if(S.i>=PUB.length) return teamsDone();
  saveGame("blind");
  if(isMe(PUB[S.order[S.i]].id)) return myBlind(PUB[S.order[S.i]]);
  const c=PUB[S.order[S.i]], forced=forcedNow();
  app.innerHTML=`

  <div class="bar"><i id="prog"></i></div>
  ${lyricBox()}
  <div class="coach">${COACHES.map(x=>`<span class="chip ${x==="你"?"me":(PM.on&&S.teams[x].includes(PM.me)?"me":"")}">${cl(x)} ${S.teams[x].length}人</span>`).join("")}</div>
  <button class="btn primary" id="play">播放</button>
  ${PM.on?"":`<button class="btn" id="turn">轉身</button>`}
  <button class="btn" id="skip">${PM.on?"跳過":"聽夠了，直接看結果"}</button>
  ${forced?'<p class="small" style="color:var(--amber)">保底輪：還有導師零人，這一位唱完直接指派。</p>':""}`;
  const au=document.getElementById("au"),chair=document.getElementById("chair");
  attachLyrics(au,FMAP[c.id+"_blind"],app.querySelector(".lyric"));
  let my=null,done=false;
  document.getElementById("play").onclick=e=>{au.play();e.target.textContent="播放中…"};
  au.ontimeupdate=()=>{document.getElementById("t").textContent=au.currentTime.toFixed(1);
    document.getElementById("prog").style.width=(au.currentTime/(au.duration||1)*100)+"%"};
  au.onended=()=>{if(!done){done=true;settle(c,my,forced)}};
  if(!PM.on) document.getElementById("turn").onclick=e=>{
    if(my!==null)return;
    my=au.currentTime||0.1;
    chair.classList.add("turned");chair.querySelector("span").textContent="已轉身";
    e.target.disabled=true;e.target.textContent="已轉身";
  };
  document.getElementById("skip").onclick=()=>{au.pause();if(!done){done=true;settle(c,my,forced)}};
}
async function settle(c,my,forced){
  app.innerHTML=`<p class="eyebrow">盲選 ${S.i+1} / ${PUB.length}</p><p class="muted">結算中…</p>`;
  const r=await cloud("turn",{id:c.id,teams:teamCounts()});
  const npc=r?r.npcTurned:NPCLIST().filter(x=>Math.random()<0.45);
  S.turns.push({id:c.id,sec:my});
  const turned=(my!==null?["你"]:[]).concat(npc);
  if(forced){
    const to=zeroTeams()[0]; S.teams[to].push(c.id);
    S.events.push(`${nm(c.id)} 是保底指派給${cl(to)}的。`);
    return after(c,`沒有轉身也沒有選擇。${nm(c.id)} 被指派給${cl(to)}。`);
  }
  if(!turned.length){S.gone.push(c.id);return after(c,`沒有人轉身。${nm(c.id)} 離開了。`)}
  if(my===null){
    const to=turned[Math.floor(Math.random()*turned.length)];
    S.teams[to].push(c.id);
    return after(c,`${turned.map(cl).join("、")}轉身。${nm(c.id)} 選了${cl(to)}。`);
  }
  if(turned.length===1){S.teams["你"].push(c.id);return after(c,`只有你轉身。${nm(c.id)} 進了你的隊。`)}
  persuadeUI(c,turned);
}
function persuadeUI(c,turned){
  const others=turned.filter(x=>x!=="你");
  app.innerHTML=`<p class="eyebrow">搶人 · ${nm(c.id)}</p>
  <div class="card"><p style="margin:0">${c.intro}</p></div>
  <p class="small muted">轉身的還有：${others.map(cl).join("、")}。他要自己選。你說一句話。</p>
  <div id="opts"></div>`;
  c.lines.forEach((line,ix)=>{
    const b=el(`<button class="btn">${line}</button>`);
    b.onclick=async()=>{
      [...document.querySelectorAll("#opts button")].forEach(x=>x.disabled=true);
      const r=await cloud("persuade",{id:c.id,option:ix,turned});
      const res=r?r.result:"平手";
      const to=r?r.to:(Math.random()<0.5?"你":others[0]);
      const why=r?r.why:`${nm(c.id)} 選了${cl(to)}。`;
      S.persuade.push({id:c.id,option:ix,result:res,won:to==="你"});
      if(to!=="你") S.events.push(`你為 ${nm(c.id)} 轉身，被${cl(to)}搶走了。`);
      S.teams[to].push(c.id); after(c,why,res);
    };
    document.getElementById("opts").appendChild(b);
  });
}
function after(c,msg,res){
  S.i++;
  const tag=res?{"大勝":"◎ 大勝","命中":"○ 命中","普通":"△ 普通","平手":"— 平手","反效果":"✗ 反效果"}[res]:"";
  app.innerHTML=`<p class="eyebrow">盲選 ${S.i} / ${PUB.length}</p>
  <div class="card"><p style="margin:0">${c.intro}</p></div>
  <p>${msg}</p>
  ${!teamOf(c.id)?"":isMe(c.id)
     ?`<p class="small muted mono">${PM.name}（${c.id} 學員・${PM.home}）${dlme("blind",`海選 盲選 ${PM.name} ${sname(c.song)}`)}</p>`
     :`<p class="small muted mono">報名表上的名字：${RNAME[c.id]}（${c.id} 學員）${dl(c.id,"blind",`海選 盲選 ${RNAME[c.id]}「${nm(c.id)}」 ${sname(c.song)}`)}</p>`}
  ${tag?`<p class="result ${res==="反效果"?"bad":"ok"}">${tag}</p>`:""}
  <div class="card">${COACHES.map(x=>`<div class="rowline"><span>${cl(x)}</span><span class="mono muted">${S.teams[x].map(nm).join(" ")||"—"}</span></div>`).join("")}</div>
  <button class="btn primary" id="n">${overflow().length?"有隊伍滿五人了":(S.i>=PUB.length?"組隊完成":"下一位")}</button>`;
  document.getElementById("n").onclick=nextStep;
}

function settleFreeBlind(c){

  const pool=NPCLIST().slice();
  for(let k=pool.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]]}

function npcTurnForMe(order){
  const Q=PM.res.blind.Q, strain=Math.max(0,Math.min(4,4-PM.res.blind.pitch/25)), rural=RURAL(PM.home);
  /* 盲選是入口，門檻放寬：Q=65 有九成會有人轉、Q=45 也還有七成。
     真正會刷掉人的是後面的 PK 和決選之夜。 */
  return NPCLIST().filter(x=>{
    let p=0.55;
    if(x==="老派技術控")p+=(2-strain)*0.18;
    if(x==="情緒派")p+=(strain-1)*0.14+0.10;
    if(x==="市場派")p+=0.20;
    if(x==="鄉土派")p+=(rural?0.20:-0.10);
    p+=(Q-72)/30*0.30;
    p-=(order-1)*0.02;
    return Math.random()<Math.max(0.10,Math.min(0.95,p));
  });
}

/* ---------- 釋出（隊伍超過四人） ---------- */
const mustCut=t=>S.teams[t].length>TEAM_HARD;
const cuttable=t=>{const free=S.teams[t].filter(id=>!S.noCut.includes(id)&&!S.keeper.includes(id));
  if(free.length||!mustCut(t))return free;
  return S.teams[t].filter(id=>!S.keeper.includes(id));};   // 強制砍時，剛進隊的也得算
function overflow(){return COACHES.filter(x=>cuttable(x).length&&
  (mustCut(x)||(S.teams[x].length>TEAM_SOFT&&!S.declined.includes(x))))}
function nextStep(){
  const o=overflow();
  if(o.length) return releasePhase(o[0]);
  S.noCut=[];S.declined=[];
  return blind();
}
const secOf=id=>{const x=S.turns.find(y=>y.id===id);
  return (x&&x.sec!==null&&x.sec!==undefined)?x.sec.toFixed(1)+" 秒":"你沒轉身"};
const blindSong=id=>{const d=PUB.find(p=>p.id===id);return d?sname(d.song):"—"};

function meLike(t){
  const r=PM.res.blind||{pitch:50};
  if(PM.free){ /* 自由模式沒有吃力度，直接用綜合分換算成導師的好感 */
    return Math.max(1,Math.min(10, 5.5 + (r.Q-FREEBAR.pk)*0.08 + (Math.random()-0.5)*0.6)); }
  const strain=Math.max(0,Math.min(4,4-r.pitch/25));
  return npcScoreLocal(t,strain,true,RURAL(PM.home));
}
function meCutWeight(t){
  const n=Math.max(1,S.teams[t].length);
  return Math.max(0.02,Math.min(0.9,(1/n)*(1+(6.9-meLike(t))*0.5)));
}
function meClaimP(x){
  return Math.max(0.03,Math.min(0.85,0.35+(meLike(x)-6.9)*0.22));
}
async function releasePhase(t){
  saveGame("blind");

    app.innerHTML=`<p class="eyebrow">釋出${force?" · 強制":""}</p><h2>${cl(t)}的隊伍滿 ${S.teams[t].length} 個人了</h2>
    <div class="card"><div class="rowline"><span>${cl(t)}</span><span class="mono">${S.teams[t].map(nm).join(" ")}</span></div></div>
    <p class="muted">${force?`超過 ${TEAM_HARD} 個人，他一定要放掉一個。`:"他在看名單…"}</p>`;
    const r=await cloud("release",{coach:t,ids:can.filter(x=>!isMe(x)),force:force});
    let cut=(r&&r.cut&&can.includes(r.cut))?r.cut:null;
    if(PM.on&&can.includes(PM.me)&&Math.random()<meCutWeight(t)) cut=PM.me;
    if(!cut&&force) cut=can[Math.floor(Math.random()*can.length)];
    if(!cut){
      S.declined.push(t);
      app.innerHTML=`<p class="eyebrow">釋出</p><h2>${cl(t)}決定都留著</h2>
      <div class="card"><div class="rowline"><span>${cl(t)}</span><span class="mono">${S.teams[t].map(nm).join(" ")}</span></div></div>
      <p class="small muted">五個人他全要。</p>
      <button class="btn primary" id="n">繼續</button>`;
      document.getElementById("n").onclick=nextStep;return;
    }
    S.cuts.push({by:t,id:cut});

  }
  app.innerHTML=`<p class="eyebrow">釋出${force?" · 強制":""}</p><h2>你的隊伍滿 ${S.teams["你"].length} 個人了</h2>
  <p class="small muted">${force
    ? `超過 ${TEAM_HARD} 個人了，<b style="color:var(--amber)">這次一定要放掉一個</b>。他會交給另外三位導師挑，三位都不要就出局。`
    : `你可以砍掉一個，交給另外三位導師挑。<b style="color:var(--amber)">三位都不要的話，他就出局。</b>${TEAM_HARD} 個以內都還能全部留著。`}</p>
  <div id="opts"></div>
  ${force?"":`<button class="btn" id="keep">都留著</button>`}`;
  S.teams["你"].forEach(id=>{
    const lock=!can.includes(id);
    const b=el(`<button class="btn"${lock?" disabled":""}>砍 ${nm(id)}　<span class="muted small">盲選唱《${blindSong(id)}》・${secOf(id)}${lock?"・剛進隊，這輪不能砍":""}</span></button>`);

  });

  if(kp) kp.onclick=()=>{S.declined.push("你");nextStep()};
}

async function claimPhase(id,from){

  <div class="card"><p style="margin:0">${c.intro}</p></div><p class="muted">另外三位在想…</p>`;
  const r=await cloud("claim",{id,exclude:from});
  const npcWant=((r&&r.want)?r.want:NPCLIST().filter(x=>x!==from&&Math.random()<0.4))
    .filter(x=>x!==from&&x!=="你"&&COACHES.includes(x));
  if(from==="你") return finishClaim(c,from,npcWant.length?npcWant[Math.floor(Math.random()*npcWant.length)]:null,npcWant);
  if(isMe(id)){

      document.getElementById("opts").appendChild(b);
    });

  if(PM.on) return finishClaim(c,from,npcWant.length?npcWant[Math.floor(Math.random()*npcWant.length)]:null,npcWant);

  <div class="card"><p style="margin:0">${c.intro}</p></div>
  <p>${cl(from)}砍掉了他。${npcWant.length?"另外想要他的："+npcWant.map(cl).join("、")+"。":"另外兩位都沒有舉手。"}</p>
  <p class="small muted">你也可以收他。說一句話，他自己決定。</p>

  <div id="opts"></div>

  c.lines.forEach((line,ix)=>{

      const to=rr?rr.to:(npcWant.length&&Math.random()<0.5?npcWant[0]:"你");
      S.persuade.push({id,option:ix,result:rr?rr.result:"平手",won:to==="你",stage:"釋出"});
      finishClaim(c,from,to,npcWant);
    };

  });
  document.getElementById("pass").onclick=()=>{

function finishClaim(c,from,to,npcWant){
  const id=c.id;
  let msg;
  if(to){
    S.teams[to].push(id); S.noCut.push(id);
    S.events.push(`${nm(id)} 被${cl(from)}放掉，${cl(to)}收了他。`);
    msg=`${cl(to)}收了 ${nm(id)}。`;
  }else{
    const potential=alive().length+(PUB.length-S.i);
    if(potential<PK_TARGET&&!isMe(id)){
      S.teams[from].push(id); S.keeper.push(id);
      S.events.push(`${nm(id)} 沒有人要，回到${cl(from)}的隊上。`);
      msg=`沒有人要他。場上人數不能再少了——他回到${cl(from)}的隊上，而且不能再被砍。`;
    }else{
      S.gone.push(id);
      const rec=S.cuts[S.cuts.length-1]; if(rec&&rec.id===id) rec.dropped=true;
      S.events.push(`${nm(id)} 被${cl(from)}砍掉，沒有人要，出局。`);
      if(isMe(id)) return playerOut("釋出",`${cl(from)}把你放掉了，另外三位都沒有接。`);
      msg=`沒有人要他。${fullnm(id)} 離開了。`;
    }
  }
  app.innerHTML=`<p class="eyebrow">釋出 · ${nm(id)}</p>
  <div class="card"><p style="margin:0">${c.intro}</p></div>
  <p>${msg}</p>
  <p class="small muted mono">報名表上的名字：${RNAME[id]}（${id} 學員）</p>
  <div class="card">${COACHES.map(x=>`<div class="rowline"><span>${cl(x)}</span><span class="mono muted">${S.teams[x].map(nm).join(" ")||"—"}</span></div>`).join("")}</div>

function fillEmptyTeams(){

function pk(){
  fillEmptyTeams();
  if(alive().length<=PK_TARGET) return nightIntro();
  saveGame("pk");
  const order=COACHES.filter(x=>S.teams[x].length>1).sort((a,b)=>S.teams[b].length-S.teams[a].length);
  if(!order.length) return nightIntro();
  const atk=order[S.pkN%order.length];
  const targets=COACHES.filter(x=>x!==atk&&S.teams[x].length>1);
  if(!targets.length) return nightIntro();
  if(atk!=="你"){
    const tg=targets[Math.floor(Math.random()*targets.length)];
    const A=S.teams[atk][0], D=S.teams[tg][Math.floor(Math.random()*S.teams[tg].length)];
    const av=songsFor(A,D), sg=(av.length?av:PKSONGS)[Math.floor(Math.random()*(av.length||PKSONGS.length))];
    return duet(atk,tg,A,D,sg);
  }
  app.innerHTML=`<p class="eyebrow">PK 第一夜 ${S.pkN+1} · 你出手</p><h2>要打哪一隊</h2>
  <p class="small muted">還剩 ${alive().length} 人，打到 ${PK_TARGET} 人。只剩一人的隊伍不能被攻擊。</p><div id="t"></div>`;
  targets.forEach(tg=>{
    const b=el(`<button class="btn">${cl(tg)}　<span class="muted small mono">${S.teams[tg].map(nm).join(" ")}</span></button>`);
    b.onclick=()=>pickFighter(tg);

  });

function duet(atk,def,a,d,sg){
  if(PM.free&&(a===PM.me||d===PM.me)){
    if(!PM.res[sg.key]){
      const foe=(a===PM.me)?d:a;
      return freeRoom({stage:sg.key,

        onGo:()=>duetFree(atk,def,a,d,sg)});
    }

  }
  if(PM.on&&(a===PM.me||d===PM.me)&&!PM.res[sg.key]){

}

  <button class="btn primary" id="ok" disabled>送出排序</button>`;
  const box=document.getElementById("stagelist");
  slots.forEach((id,ix)=>{
    const p=PUB.find(x=>x.id===id), ok=hasClip(id,'night');
    const card=el(`<div class="card">
      <div class="rowline"><span><b>${LABELS[ix]}</b>　<span class="small muted">《${sname(p.night)}》${ok?"":"（音檔還沒渲染）"}</span>${dl(id,"night",`海選 決選之夜 ${LABELS[ix]} ${sname(p.night)}`)}</span><span class="mono muted" id="r${ix}">—</span></div>
      ${ok?`<audio controls src="${clip(id,'night')}"></audio>`:`<p class="small" style="color:var(--amber)">這一位的決選之夜音檔還沒做好，只能憑前面幾關的印象排。</p>`}
      ${lyricBox()}
      <button class="btn" data-ix="${ix}">選 ${LABELS[ix]}</button>
    </div>`);
    box.appendChild(card);
    const _au=card.querySelector("audio");
    if(_au) attachLyrics(_au,FMAP[id+"_night"],card.querySelector(".lyric"));
    else {const lb=card.querySelector(".lyric"); if(lb) lb.style.display="none";}
  });
  const refresh=()=>{
    slots.forEach((_,ix)=>{
      const r=S.night.myRank.indexOf(ix);
      document.getElementById("r"+ix).textContent=r<0?"—":"第 "+(r+1)+" 名";
      const b=box.querySelector(`button[data-ix="${ix}"]`);
      b.disabled=r>=0; b.style.opacity=r>=0?.35:1;
    });
    document.getElementById("rankline").textContent=
      S.night.myRank.length?S.night.myRank.map((ix,k)=>`${k+1}.${LABELS[ix]}`).join("　"):"—";
    document.getElementById("ok").disabled=S.night.myRank.length!==slots.length;
  };
  box.querySelectorAll("button[data-ix]").forEach(b=>{
    b.onclick=()=>{S.night.myRank.push(+b.dataset.ix);refresh()};
  });
  document.getElementById("undo").onclick=()=>{S.night.myRank.pop();refresh()};
  refresh();
  document.getElementById("ok").onclick=async()=>{
    document.getElementById("ok").disabled=true;
    const ids=S.night.myRank.map(ix=>slots[ix]);
    const r=await cloud("nightRank",{ids});
    const n=ids.length;
    const npcRanks=r?r.npcRanks:NPCLIST().map(()=>shuffled(n).map(k=>ids[k]));
    const sum={}; ids.forEach((id,k)=>sum[id]=k+1);
    npcRanks.forEach(list=>list.forEach((id,k)=>sum[id]+=k+1));
    const board=ids.map(id=>({id,sum:sum[id]})).sort((a,b)=>a.sum-b.sum);
    const out=[];
    for(let k=board.length-1;k>=0&&out.length<2;k--){
      const id=board[k].id,t=teamOf(id);
      if(S.teams[t].length-out.filter(o=>teamOf(o)===t).length<=1) continue;
      out.push(id);
    }
    while(out.length<2){const cand=board.slice().reverse().find(x=>!out.includes(x.id));if(!cand)break;out.push(cand.id)}
    S.night.board=board; S.night.out=out; S.night.myOrder=ids; S.night.done=true;
    nightResult(board,out,ids,npcRanks);
  };
}

  const box=document.getElementById("stagelist");
  slots.forEach((id,ix)=>{

    const card=el(`<div class="card">
      <div class="rowline"><span><b>${LABELS[ix]}</b>　<span class="small muted">《${sname(song)}》${ok?"":"（音檔還沒渲染）"}</span>${
        isMe(id)?dlme("night",`海選 決選之夜 ${LABELS[ix]} ${sname(song)}`):dl(id,"night",`海選 決選之夜 ${LABELS[ix]} ${sname(song)}`)}</span></div>
      ${ok?`<audio controls src="${clip(id,'night')}"></audio>`:`<p class="small" style="color:var(--amber)">這一位的音檔還沒做好。</p>`}
      ${lyricBox()}
    </div>`);

    else {const lb=card.querySelector(".lyric"); if(lb) lb.style.display="none";}
  });
  document.getElementById("ok").onclick=async()=>{
    document.getElementById("ok").disabled=true;
    const ids=slots.slice();
    const r=await cloud("nightRank",{ids:ids.filter(x=>!isMe(x))});
    const n=ids.length;
    let npcRanks=r?r.npcRanks:NPCLIST().map(()=>shuffled(n).map(k=>ids[k]));
    /* 後端不認得你，把你依這一首的實力插回每一份排序 */
    const mine=playerScore(PM.res.night,heardCount(PM.me),(PUB.find(x=>x.id===PM.me)||{}).order);
    npcRanks=npcRanks.map((list,k)=>{
      const v=mine.npcs[k%mine.npcs.length];
      const pos=Math.max(0,Math.min(list.length,Math.round((8.6-v)*list.length/3.4)));
      const cp=list.filter(x=>!isMe(x)); cp.splice(pos,0,PM.me); return cp;
    });
    const sum={}; ids.forEach(id=>sum[id]=0);
    npcRanks.forEach(list=>list.forEach((id,k)=>sum[id]+=k+1));
    const board=ids.map(id=>({id,sum:sum[id]})).sort((a,b)=>a.sum-b.sum);
    const out=[];
    for(let k=board.length-1;k>=0&&out.length<2;k--){
      const id=board[k].id,t=teamOf(id);
      if(!isMe(id)&&S.teams[t].length-out.filter(o=>teamOf(o)===t).length<=1) continue;
      out.push(id);
    }
    while(out.length<2){const cand=board.slice().reverse().find(x=>!out.includes(x.id));if(!cand)break;out.push(cand.id)}
    S.night.board=board; S.night.out=out; S.night.myOrder=null; S.night.done=true;
    nightResult(board,out,null,npcRanks);
  };
}

  ${S.events.length?`<div class="card"><h2 style="font-size:18px">發生過的事</h2>${S.events.map(e=>`<p class="small" style="margin:6px 0">${e}</p>`).join("")}</div>`:""}
  <button class="btn primary" id="again">再玩一次</button>
  <button class="btn danger" id="wipe">清掉這台裝置上的所有錄音</button>
  <p class="small muted">同一批人、同一批歌。變的只有你。</p>`;
  document.getElementById("again").onclick=()=>{clearSave();resetState();intro()};
  document.getElementById("wipe").onclick=async()=>{
    if(!confirm("把這台裝置上所有海選的錄音刪掉？刪掉就找不回來了。"))return;
    await REC.wipe();Object.keys(takeURLs).forEach(k=>delete takeURLs[k]);
    document.getElementById("wipe").disabled=true;
    document.getElementById("wipe").textContent="錄音已經清掉";
  };
}
async function report(){
  if(PM.on) return reportMe();
  clearSave();
  app.innerHTML=`<p class="eyebrow">結算</p><p class="muted">正在對帳…</p>`;
  const champ=S.scores.filter(s=>s.stage==="決賽").sort((a,b)=>b.total-a.total)[0];
  const r=await cloud("report",{turns:S.turns,scores:S.scores,persuade:S.persuade,pkPicks:S.pkPicks,
    night:S.night?{myOrder:S.night.myOrder,board:S.night.board,out:S.night.out}:null,
    champion:champ?champ.id:"",teams:S.teams,events:S.events});
  const f=v=>v===null||v===undefined?"—":(v>=0?"+":"")+Number(v).toFixed(2);
  const cls=v=>v===null||v===undefined?"":(v>0?"pos":"neg");
  const turnedYes=S.turns.filter(t=>t.sec!==null);
  const stolen=S.persuade.filter(p=>!p.won), myCuts=S.cuts.filter(x=>x.by==="你"),
        cutGone=myCuts.filter(x=>x.dropped);
  const myPicks=S.pkPicks.filter(p=>p.byYou);
  const cnt={}; myPicks.forEach(p=>cnt[p.song]=(cnt[p.song]||0)+1);
  const topSong=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const nightMine=(S.night&&S.night.myOrder)?S.night.myOrder.map((id,k)=>({id,r:k+1}))
      .filter(x=>(S.teams["你"].includes(x.id)||(S.night.out||[]).includes(x.id))):[];
  app.innerHTML=`<p class="eyebrow">結算</p>
  <h1 style="font-size:38px">這是你的資料</h1>
  <p class="muted">下面每一個數字，都是你自己的選擇算出來的。</p>

  <div class="card"><h2 style="font-size:18px">盲選 · 你轉了幾次身</h2>
    <div class="rowline"><span>轉身次數</span><span class="mono">${turnedYes.length} / ${PUB.length}</span></div>
    <div class="rowline"><span>轉了之後真的搶到</span><span class="mono">${S.teams["你"].length + (S.night&&S.night.out?S.night.out.filter(id=>S.persuade.some(p=>p.id===id&&p.won)).length:0)} 人</span></div>
    <div class="rowline"><span>轉了卻被搶走</span><span class="mono ${stolen.length?"neg":""}">${stolen.length}</span></div>
    <div class="rowline"><span>平均聽幾秒才轉</span><span class="mono">${r&&r.avgSec?r.avgSec.toFixed(1)+" 秒":(turnedYes.length?(turnedYes.reduce((a,t)=>a+t.sec,0)/turnedYes.length).toFixed(1)+" 秒":"—")}</span></div>
    ${r?`<div class="rowline"><span>你轉的人・平均吃力程度</span><span class="mono">${r.strainYes!==null?r.strainYes.toFixed(2):"—"}</span></div>
    <div class="rowline"><span>你沒轉的人・平均吃力程度</span><span class="mono">${r.strainNo!==null?r.strainNo.toFixed(2):"—"}</span></div>`:""}
    ${myCuts.length?`<div class="rowline"><span>你砍掉的人</span><span class="mono">${myCuts.length}</span></div>
    <div class="rowline"><span>其中沒人要、被你砍掉就出局的</span><span class="mono ${cutGone.length?"neg":""}">${cutGone.length}</span></div>`:""}
    ${stolen.length?`<p class="small muted" style="margin:10px 0 0">被搶走的：${stolen.map(p=>nm(p.id)).join("、")}。</p>`:""}
    ${cutGone.length?`<p class="small" style="color:var(--amber);margin:10px 0 0">${cutGone.map(x=>fullnm(x.id)).join("、")} 是你放掉的，沒有人接住。</p>`:""}
  </div>

  ${myPicks.length?`<div class="card"><h2 style="font-size:18px">PK 第一夜 · 你選的題目</h2>
    ${PKSONGS.map(s=>`<div class="rowline"><span>《${sname(s.song)}》<span class="small muted"> ${s.dim}</span></span><span class="mono muted">${cnt[s.song]||0} 場</span></div>`).join("")}
    ${topSong&&topSong[1]>=myPicks.length*0.6?`<p class="small muted" style="margin:10px 0 0">你 ${myPicks.length} 場裡有 ${topSong[1]} 場選了《${sname(topSong[0])}》——你只敢在同一種題目上打。</p>`
      :`<p class="small muted" style="margin:10px 0 0">你在三種題目之間換來換去。</p>`}
  </div>`:""}

  ${S.night&&S.night.board?`<div class="card"><h2 style="font-size:18px">決選之夜 · 你的排序</h2>
    <div class="rowline"><span>你的第 1 名，最後總名次</span><span class="mono">第 ${S.night.board.findIndex(x=>x.id===S.night.myOrder[0])+1} 名</span></div>
    <div class="rowline"><span>你把自己人排進前四</span><span class="mono">${S.night.myOrder.slice(0,4).filter(id=>S.teams["你"].includes(id)||(S.night.out||[]).includes(id)&&S.persuade.some(p=>p.id===id&&p.won)).length} 人</span></div>
    ${nightMine.length?`<p class="small muted" style="margin:10px 0 0">你自己的人排在：${nightMine.map(x=>nm(x.id)+" 第"+x.r).join("、")}</p>`:""}
    ${(S.night.out||[]).length?`<p class="small" style="margin:8px 0 0">出局：${S.night.out.map(nm).join("、")}</p>`:""}
  </div>`:""}

  ${r?`<div class="card"><h2 style="font-size:18px">說服</h2>
    <div class="rowline"><span>說中他在意的事</span><span class="mono">${r.hits} / ${r.outs}</span></div>
    <div class="rowline"><span>猜錯</span><span class="mono ${r.wrong?"neg":""}">${r.wrong}</span></div>
    ${r.theirCare?`<p class="small muted" style="margin:10px 0 0">站在你面前的人，最多是在意「${r.theirCare}」。</p>`:""}
  </div>
  <div class="card"><h2 style="font-size:18px">你的評分跟什麼有關</h2>
    <table><tbody>${r.corr.map(([k,v])=>`<tr><td>${k}</td><td class="num report-num ${cls(v)}">${f(v)}</td></tr>`).join("")}</tbody></table>
    <p class="small muted" style="margin:12px 0 0">相關係數。正的代表越多你給越高，負的相反。</p>
  </div>`:'<div class="card"><p class="small" style="color:var(--red)">離線模式：沒有連上後端，這一局沒有相關係數。</p></div>'}

  <div class="card"><div class="rowline"><span>冠軍</span><span class="mono">${champ?fullnm(champ.id)+"（"+cl(teamOf(champ.id))+"）":"—"}</span></div></div>
  ${S.events.length?`<div class="card"><h2 style="font-size:18px">發生過的事</h2>${S.events.map(e=>`<p class="small" style="margin:6px 0">${e}</p>`).join("")}</div>`:""}
  <div class="card"><h2 style="font-size:18px">把歌帶走</h2>
    <p class="small muted" style="margin:0 0 12px">十六個人今晚唱過的每一首，都在這裡。</p>
    ${PUB.map(pp=>{
      const st=[["blind","盲選",sname(pp.song)],
                ["pk_04","PK","繞路"],["pk_01","PK","風向"],["pk_03","PK","定影"],
                ["night","決選之夜",sname(pp.night)],["final","決賽","會客時間"]]
        .filter(x=>hasClip(pp.id,x[0]));
      if(!st.length) return "";
      return `<div class="rowline" style="align-items:flex-start"><span style="min-width:170px">${fullnm(pp.id)}</span>
        <span class="dlrow" style="text-align:right">${st.map(x=>
          dl(pp.id,x[0],`海選 ${x[1]} ${RNAME[pp.id]}「${nm(pp.id)}」 ${x[2]}`)
            .replace(">⬇ 下載<",`>⬇ ${x[1]}《${x[2]}》<`)
        ).join("")}</span></div>`;
    }).join("")}
    <p class="small muted" style="margin:12px 0 0">${champ?`冠軍 ${fullnm(champ.id)} 的決賽那首，值得留著。`:""}</p>
  </div>
  <button class="btn primary" id="again">再玩一次</button>
  <p class="small muted">同一批人、同一批歌。變的只有你。</p>`;
  document.getElementById("again").onclick=()=>{clearSave();resetState();intro()};
}
resetState(); intro();

</script>
